<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>splash-timing-demo</title>
<style>
  /* ---- copied verbatim from lib/client.js (the parts that matter for timing) ---- */
  html, body { margin: 0; height: 100%; background: #05080e; overflow: hidden; }

  div[data-hdd-splash] {
    position: fixed; inset: 0;
    background-color: #05080e;
    overflow: hidden;
    /* the real splash centres the emblem in its stage; without this the demo lies */
    display: grid; place-items: center;
  }
  [data-hdd-backdrop] {
    position: absolute; inset: 0;
    background-position: center; background-size: cover; background-repeat: no-repeat;
    opacity: 0; transition: opacity 620ms ease-out;
  }
  [data-hdd-backdrop][data-on="true"] { opacity: 1; }

  [data-hdd-field] {
    position: absolute; inset: 0;
    background-position: center; background-size: cover; background-repeat: no-repeat;
    opacity: 0;
    transform: scale(0.04);
    transform-origin: 50% 50%;
    transition: transform 620ms cubic-bezier(0.22, 0.61, 0.36, 1), opacity 620ms ease-out;
  }
  [data-hdd-field][data-on="true"] { opacity: 1; transform: scale(1); }
  [data-hdd-field][data-on="false"] { opacity: 0; transition: opacity 1150ms ease-in; }

  @property --hdd-reveal {
    syntax: "<percentage>";
    inherits: false;
    initial-value: 0%;
  }
  [data-hdd-backdrop][data-reveal="mask"] {
    --hdd-reveal: 0%;
    mask-image: radial-gradient(circle at 50% 50%, transparent var(--hdd-reveal), #000 calc(var(--hdd-reveal) + 14%));
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--hdd-reveal), #000 calc(var(--hdd-reveal) + 14%));
    transition: --hdd-reveal 620ms ease-out, opacity 620ms ease-out;
  }
  [data-hdd-backdrop][data-reveal="mask"][data-on="false"] { --hdd-reveal: 150%; }

  [data-hdd-holder] {
    position: relative;
    width: min(300px, 42vw);
    aspect-ratio: 1 / 1;
    height: auto;
    transform: scale(0.42);
    transition: transform 620ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  [data-hdd-holder][data-on="true"] { transform: scale(1); }

  /* stand-in for the emblem vector: same size, colour and centre */
  [data-hdd-mark] {
    width: 100%; height: 100%; border-radius: 50%;
    border: 14px solid #2f45ff;
    box-shadow: 0 0 0 6px #ffffff inset, 0 0 60px 8px rgba(47, 69, 255, 0.55);
    box-sizing: border-box;
  }

  /* ---- demo chrome (not part of the skin) ---- */
  #clock { position: fixed; left: 12px; bottom: 10px; z-index: 10; font: 600 20px/1 ui-monospace, Consolas, monospace; color: #7fe3ff; }
  #log { position: fixed; left: 12px; top: 10px; z-index: 10; font: 500 13px/1.45 ui-monospace, Consolas, monospace; color: #9bb3c8; white-space: pre; }
</style>
</head>
<body>
<div data-hdd-splash="true"></div>
<div id="clock">0 ms</div>
<div id="log"></div>
<script>
  /* ?min=900&swap=620&lead=240&loop=1 — numbers come from query so one file can试多组 */
  const q = new URLSearchParams(location.search)
  /* `Number(null)` is 0, which silently turned every override into zero — check for
     presence, not truthiness of the parse. */
  const num = (key, fallback) => {
    if (!q.has(key)) return fallback
    const value = Number(q.get(key))
    return Number.isFinite(value) ? value : fallback
  }
  const COVER_MIN = num('min', 900)
  const COVER_SWAP = num('swap', 620)
  const RING_LEAD = num('lead', 240)
  const LOOP = q.get('loop') !== '0'

  const ASSETS = 'file:///C:/Users/Proud/.dsh/hdd-fairy/assets'
  const BACKDROP = `${ASSETS}/boot.png`
  const PLATE = `${ASSETS}/boot-field.png`

  const root = document.querySelector('[data-hdd-splash]')
  const clockEl = document.getElementById('clock')
  const logEl = document.getElementById('log')
  const supportsRing = CSS.supports('transition-property', '--hdd-reveal')

  let startedAt = 0
  let marks = []
  const at = (label) => {
    const value = Math.round(performance.now() - startedAt)
    marks.push({ value, label })
    logEl.textContent = marks.map((m) => `${String(m.value).padStart(5)} ms  ${m.label}`).join('\n')
    return value
  }
  const tick = () => {
    if (startedAt !== 0) clockEl.textContent = `${Math.round(performance.now() - startedAt)} ms`
    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)

  const publish = () => {
    const find = (needle) => {
      const hit = marks.find((m) => m.label.includes(needle))
      return hit === undefined ? -1 : hit.value
    }
    const maskEnd = marks.find((m) => m.label.startsWith('plate end'))
    document.title = [
      'DEMO',
      `min=${COVER_MIN}`,
      `swap=${COVER_SWAP}`,
      `lead=${RING_LEAD}`,
      `plate=${find('plate on')}`,
      `maskEnd=${maskEnd === undefined ? 'none' : maskEnd.value}`,
      `maskProp=${maskEnd === undefined ? 'none' : maskEnd.label.replace('plate end: ', '')}`,
      `emblem=${find('emblem start')}`,
      `pop=${find('emblem pops')}`,
      `emuRun=${find('emblem run')}`,
      `samples=${samples.join(',')}`,
      supportsRing ? 'supports=yes' : 'supports=no',
    ].join('|')
  }

  /** Sample the animated custom property so a silent snap is visible as "flat" values. */
  let samples = []

  const run = () => {
    marks = []
    samples = []
    startedAt = performance.now()
    root.innerHTML = ''

    const backdrop = document.createElement('div')
    backdrop.setAttribute('data-hdd-backdrop', 'true')
    backdrop.setAttribute('data-reveal', 'mask')
    backdrop.style.backgroundImage = `url("${BACKDROP}")`
    root.appendChild(backdrop)
    at('backdrop added')
    setTimeout(() => { backdrop.setAttribute('data-on', 'true'); at('backdrop on') }, 0)

    const field = document.createElement('div')
    field.setAttribute('data-hdd-field', 'true')
    field.style.backgroundImage = `url("${PLATE}")`
    field.addEventListener('transitionend', (event) => {
      if (event.target !== field) return
      at(`plate end: ${event.propertyName}`)
    })

    const holder = document.createElement('div')
    holder.setAttribute('data-hdd-holder', 'true')
    holder.innerHTML = '<div data-hdd-mark="true"></div>'
    holder.addEventListener('transitionend', (event) => {
      if (event.target === holder) at('emblem run')
    })

    setTimeout(() => {
      at('handoff: backdrop off')
      backdrop.setAttribute('data-on', 'false')
      setTimeout(() => {
        at('cover swap done')
        root.appendChild(field)
        setTimeout(() => { field.setAttribute('data-on', 'true'); at('plate on') }, 20)
        for (let i = 1; i <= 8; i += 1) {
          setTimeout(() => {
            samples.push(getComputedStyle(field).getPropertyValue('--hdd-reveal').trim())
          }, 20 + i * 70)
        }
        setTimeout(() => {
          root.appendChild(holder)
          at('emblem start')
          setTimeout(() => { holder.setAttribute('data-on', 'true'); at('emblem pops') }, 60)
        }, 20 + RING_LEAD)
      }, COVER_SWAP)
    }, COVER_MIN)

    setTimeout(publish, COVER_MIN + COVER_SWAP + RING_LEAD + 2000)
  }

  const start = () => {
    run()
    if (LOOP) setTimeout(start, 7000)
  }
  let pending = 2
  const ready = () => { pending -= 1; if (pending === 0) setTimeout(start, 300) }
  for (const url of [BACKDROP, PLATE]) {
    const image = new Image()
    image.onload = ready
    image.onerror = ready
    image.src = url
  }
</script>
</body>
</html>
